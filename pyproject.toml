[project]
name = "distance-map"
version = "0.1.0"
description = "Commute time isochrone and distance circle map"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "streamlit-folium>=0.22.0",
    "folium>=0.17.0",
    "requests>=2.32.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
